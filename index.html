<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>泊一区 夏祭り 2026 −フィールドワーク・デジタルアーカイブ</title>
<style>
:root{
  --bg:#16202b; --panel:#1e2a37; --panel2:#24327f; --line:#e8533a;
  --line2:#e8533a; --accent:#f6b352; --text:#eef1f4; --muted:#9fb0bf;
  --chip:rgba(255,255,255,.06);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden;
}
.wrap{display:flex; height:100vh}
/* ===== 左パネル ===== */
.side{
  width:340px; flex:0 0 340px; padding:26px 24px 20px; overflow-y:auto;
  border-right:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,#1c2833 0%,#15202b 100%);
  display:flex; flex-direction:column; gap:16px;
}
h1{font-size:27px; line-height:1.25; font-weight:800; letter-spacing:.02em}
h1 small{display:block; font-size:12px; color:var(--muted); font-weight:500; margin-top:6px}
.poster{border-radius:12px; overflow:hidden; box-shadow:0 10px 26px rgba(0,0,0,.4)}
.poster img{width:100%; display:block}
.summary{font-size:13px; line-height:1.85; color:#d6dee6}
.summary b{color:var(--accent)}
.howto{
  font-size:12px; color:var(--muted); line-height:1.8; padding:12px 14px;
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:10px;
}
.howto b{color:var(--accent)}
.counter{font-size:12px; color:var(--muted); margin-top:auto; padding-top:10px; border-top:1px solid rgba(255,255,255,.08)}
/* ===== メイン ===== */
.main{flex:1; display:flex; flex-direction:column; min-width:0; position:relative}
/* 表示ビューワ */
.viewer{flex:0 0 46%; min-height:260px; position:relative;
  background:radial-gradient(120% 160% at 50% 0%,#2a3a52 0%, #1a2531 55%, #141d26 100%);
  display:flex; align-items:center; justify-content:center; padding:18px;}
.viewer img{max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 14px 40px rgba(0,0,0,.55);
  transition:opacity .22s ease, transform .3s ease; cursor:zoom-in; object-fit:contain}
.viewer img.hide{opacity:0}
.cap{position:absolute; left:22px; bottom:16px; display:flex; align-items:center; gap:10px; font-size:12.5px}
.cap .idx{color:var(--accent); font-weight:700; font-size:13px}
.cap .ts{color:var(--muted)}
/* ===== タイムライン ===== */
.timeline{flex:1; position:relative; display:flex; flex-direction:column; justify-content:center;
  padding:0 26px 10px; min-height:240px}
.bd{position:relative; overflow:hidden; height:360px}
.centerline{position:absolute; left:0; right:0; top:180px; height:2px;
  background:linear-gradient(90deg,transparent,#e8533a 6%,#e8533a 94%,transparent)}
.centerline::after{content:"撮影時刻 →"; position:absolute; right:4px; top:-24px;
  font-size:10.5px; color:var(--muted); letter-spacing:.08em}
.row{position:absolute; top:0; left:0; height:360px; will-change:transform; transition:transform .18s ease}
.chip{position:absolute; width:78px; height:78px; transform:translate(-50%,-50%); opacity:.18;
  transition:opacity .35s ease; cursor:pointer; background:transparent; border:none; padding:0}
.chip .im{width:100%; height:100%; border-radius:8px; overflow:hidden; position:relative;
  box-shadow:0 4px 12px rgba(0,0,0,.3); border:2px solid transparent; transition:border-color .2s, transform .15s;}
.chip .im img{width:100%; height:100%; object-fit:cover; display:block}
.chip::before{content:""; position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px;
  border-radius:50%; background:rgba(246,179,82,.0); transition:background .2s, transform .2s; pointer-events:none}
.chip .im::after{content:""; position:absolute; width:1px; background:rgba(232,83,58,.5); left:50%;
  height:0; transition:height .3s ease}
.chip.above .im::after{top:100%; height:62px}
.chip.below .im::after{bottom:100%; height:62px}
.chip.unk .im{border-color:var(--accent); box-shadow:0 0 0 3px rgba(246,179,82,.35), 0 8px 22px rgba(0,0,0,.5); transform:scale(1.12)}
.chip.unk .im::after{height:74px; background:var(--accent)}
.chip.unk::before{background:rgba(246,179,82,.0)}
.chip:hover .im{transform:scale(1.15)}
/* スライダートラック */
.ctl{padding:6px 2px 2px}
.track{position:relative; height:34px; display:flex; align-items:center; touch-action:none; cursor:pointer}
.trackline{position:absolute; left:0; right:0; height:6px; border-radius:4px;
  background:linear-gradient(90deg,#6b7483,#3a4453)}
.fill{position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:4px;
  background:linear-gradient(90deg,#f6b352,#e8533a)}
.knob{position:absolute; top:50%; width:46px; height:46px; border-radius:50%; transform:translate(-50%,-50%);
  cursor:grab; left:0}
.knob:active{cursor:grabbing}
.knob .ring{position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffcf7d,#f6a94f 60%,#e0762f);
  box-shadow:0 5px 14px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.25);}
.knob .ring::after{content:""; position:absolute; inset:9px; border-radius:50%;
  background:#c9672b; box-shadow:inset 0 2px 4px rgba(255,255,255,.4)}
.tick{position:absolute; bottom:-2px; font-size:10px; color:var(--muted); transform:translateX(-50%); pointer-events:none}
.playbtn{position:absolute; right:26px; bottom:20px; background:var(--accent); color:#33200f; border:none;
  padding:9px 15px; border-radius:24px; font-size:12.5px; font-weight:700; cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.35); transition:transform .1s}
.playbtn:hover{transform:scale(1.05)}
.playbtn.on{background:#5bd67a; color:#0d2a12}
/* ライトボックス */
.lb{position:fixed; inset:0; background:rgba(8,12,16,.92); display:none; align-items:center; justify-content:center; z-index:50}
.lb.open{display:flex}
.lb img{max-width:92vw; max-height:86vh; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb .lbcap{position:absolute; bottom:26px; left:50%; transform:translateX(-50%); font-size:13px; color:#cfe0ee;
  background:rgba(0,0,0,.55); padding:8px 16px; border-radius:20px}
.lb .close{position:absolute; top:20px; right:26px; font-size:32px; color:#fff; cursor:pointer; line-height:1}
@media(max-width:860px){ .side{width:100%; flex:none; height:auto; border-right:none; border-bottom:1px solid rgba(255,255,255,.1)}
  .wrap{flex-direction:column; overflow:auto} body{overflow:auto} }
</style>
</head>

 "wh": "6000x3368"}, {"n": 89, "file": "IMG_9617.JPG", "med": "med_IMG_9617.jpg", "tn": "tn_IMG_9617.jpg", "ts": "2026-07-26T00:02:47", "time_label": "00:02", "date_label": "7/26", "wh": "6000x3368"}];
const SPACING=92, BAND=180, HW=78;
const row=document.getElementById('row'), bd=document.getElementById('bd');
const track=document.getElementById('track'), knob=document.getElementById('knob'), fill=document.getElementById('fill');
const vimg=document.getElementById('vimg'), vidx=document.getElementById('vidx'), vts=document.getElementById('vts');
const counter=document.getElementById('counter');
let cur=0, playing=false, tmr=null;
const total=D.length;

/* チップ配置 */
D.forEach((p,i)=>{
  const c=document.createElement('button');
  c.className='chip '+ (i%2?'below':'above');
  const up=(i%2===0);
  const amp = up ? -(70+22*(i%3)) : (68+22*(i%3));
  c.style.left=(i*SPACING+HW/2)+'px';
  c.style.top=(BAND+amp)+'px';
  c.innerHTML='<span class="im"><img loading="lazy" src="photos/'+p.tn+'" alt="'+i+'"></span>';
  c.dataset.i=i;
  c.onclick=()=>{ setCur(i); };
  row.appendChild(c);
});
row.style.width=( (total-1)*SPACING + HW )+'px';

/* メイン更新 */
function setCur(i){
  cur=Math.max(0,Math.min(total-1,i));
  const p=D[cur];
  vimg.classList.add('hide');
  setTimeout(()=>{ vimg.src='photos/'+p.med; vimg.onload=()=>vimg.classList.remove('hide'); },140);
  vidx.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  vts.textContent=p.date_label+' '+p.time_label+' ・ '+p.file;
  counter.textContent='記録済み写真 '+total+' 枚（撮影時刻順） ・ 2026-07-25 〜 07-26';
  paint();
  centerChip(cur);
}
function paint(){
  const chips=row.children;
  for(let i=0;i<chips.length;i++){
    chips[i].style.opacity=(i<=cur)? '1':'.16';
    chips[i].classList.toggle('unk', i===cur);
  }
  const pct=cur/(total-1)*100;
  fill.style.width=pct+'%';
  knob.style.left=pct+'%';
}
function centerChip(i){
  const x=i*SPACING - bd.clientWidth/2 + HW/2;
  row.style.transform='translateX('+(-x)+'px)';
}

/* スライダー操作 */
let drag=false;
function posToIdx(px){
  const r=track.getBoundingClientRect();
  const p=(px-r.left)/r.width;
  return Math.round(Math.max(0,Math.min(1,p))*(total-1));
}
track.addEventListener('pointerdown',e=>{ drag=true; track.setPointerCapture(e.pointerId); setCur(posToIdx(e.clientX)); });
track.addEventListener('pointermove',e=>{ if(drag) setCur(posToIdx(e.clientX)); });
track.addEventListener('pointerup',()=>drag=false);
track.addEventListener('pointercancel',()=>drag=false);

/* 自動再生 */
const play=document.getElementById('play');
play.onclick=()=>{
  playing=!playing; play.textContent=playing?'■ 停止':'▶ 自動再生'; play.classList.toggle('on',playing);
  if(playing){ tmr=setInterval(()=>{ if(cur>=total-1){stop();} else setCur(cur+1);},900); }
  else clearInterval(tmr);
};
function stop(){ playing=false; clearInterval(tmr); play.textContent='▶ 自動再生'; play.classList.remove('on'); }

/* ライトボックス */
const lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg'), lbcap=document.getElementById('lbcap');
lb.onclick=()=>lb.classList.remove('open');
vimg.onclick=()=>{ const p=D[cur]; lbimg.src='photos/'+p.med; lbcap.textContent=p.date_label+' '+p.time_label+' ・ '+p.file; lb.classList.add('open'); };

window.addEventListener('resize',()=>centerChip(cur));
setCur(0);
</script>
